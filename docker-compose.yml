services:
  postgres:
    image: postgres:16-alpine
    container_name: pfa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pfa_dev
      POSTGRES_USER: pfa
      POSTGRES_PASSWORD: pfa_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pfa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfa -d pfa_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pfa_pgdata:
