name: CI

on:
  push:
    branches: [main, dev, prod]
  pull_request:
    branches: [main, dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pfa_test
          POSTGRES_USER: pfa
          POSTGRES_PASSWORD: pfa_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pfa -d pfa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: '3002'
      LOG_LEVEL: fatal
      DATABASE_URL: postgres://pfa:pfa_test_password@localhost:5432/pfa_test
      JWT_ACCESS_SECRET: ci-access-secret-must-be-at-least-32-chars-long
      JWT_REFRESH_SECRET: ci-refresh-secret-must-be-at-least-32-chars-diff
      COOKIE_DOMAIN: ''
      FRONTEND_ORIGIN: http://localhost:5173
      FLAG_PLAID: 'false'
      # v2 recurring detection tests hit /api/v1/recurring which is
      # conditionally mounted — flag must be on for the tests to reach it.
      FLAG_RECURRING: 'true'
      FLAG_MULTI_CURRENCY: 'false'
      # v2 net-worth chart tests hit /api/v1/dashboard/net-worth, also
      # conditionally mounted — same reason as FLAG_RECURRING above.
      FLAG_NET_WORTH: 'true'
      # v2 hierarchy tests exercise dashboard rollup logic gated behind
      # this flag; keep it on so both branches (rollup + flat) are checked
      # by the test suite.
      FLAG_HIERARCHICAL_CATEGORIES: 'true'
      # v2 password-reset routes are conditionally mounted; tests need
      # them reachable.
      FLAG_PASSWORD_RESET: 'true'
      # v3 rule-learning: POST /rules/learned is conditionally mounted +
      # PATCH /transactions returns suggestedRule only when this is on.
      FLAG_RULE_LEARNING: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run migrations
        run: npm run migrate:up:ci

      - name: Test
        run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
