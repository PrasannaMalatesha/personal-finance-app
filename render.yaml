# Render blueprint (https://render.com/docs/blueprint-spec).
# Point Render at this repo, pick "New Blueprint Instance", and Render will
# provision the backend service using this file.
#
# You still need to set the secret env vars in the Render dashboard:
#   DATABASE_URL, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, FRONTEND_ORIGIN,
#   COOKIE_DOMAIN. See README §Deploy for the recipe.

services:
  - type: web
    name: personal-finance-api
    runtime: node
    plan: free
    # us-east-1 to co-locate with the Neon database (also us-east-1) — keeps
    # per-query round-trips local instead of cross-country.
    region: virginia
    rootDir: backend
    # Migrations run in build so a failed migration fails the deploy —
    # never end up with a running server pointed at the wrong schema.
    # --include=dev: the build needs devDependencies (typescript for `tsc`,
    # node-pg-migrate for migrations). NODE_ENV=production would otherwise make
    # `npm ci` omit them. Runtime (`node dist/server.js`) only needs the compiled
    # output + `dependencies`, so this doesn't bloat what actually serves traffic.
    buildCommand: npm ci --include=dev && npm run migrate:up:ci && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /healthz
    # Monorepo: skip a backend deploy when a push only touches frontend/.
    # Any change to backend/ or root config (this file) still rebuilds.
    buildFilter:
      ignoredPaths:
        - frontend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: 3001
      # Feature flags default off; flip them in the dashboard when a v2
      # feature is ready to enable in prod.
      # v2/v3 features with no external dependency — enabled in prod.
      - key: FLAG_RECURRING
        value: 'true'
      - key: FLAG_MULTI_CURRENCY
        value: 'true'
      - key: FLAG_NET_WORTH
        value: 'true'
      - key: FLAG_HIERARCHICAL_CATEGORIES
        value: 'true'
      - key: FLAG_RULE_LEARNING
        value: 'true'
      # These need real credentials (see the secret block below) — off until set.
      - key: FLAG_PLAID
        value: 'false'
      - key: FLAG_PASSWORD_RESET
        value: 'false'
      - key: FLAG_OAUTH
        value: 'false'
      # Required secrets — set in the Render dashboard, not in this file.
      # The server refuses to boot without these (see config/env.ts). Note
      # JWT_ACCESS_SECRET and JWT_REFRESH_SECRET must be >= 32 chars AND differ.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      # Optional — safe to leave unset for a first deploy. Defaults documented
      # in config/env.ts.
      - key: COOKIE_DOMAIN
        sync: false
      - key: SENTRY_DSN
        sync: false
      # This backend's own public origin (the Render URL). Only needed once
      # FLAG_OAUTH is on — it builds the Google redirect URI, which must match
      # the one registered in the Google console. Defaults to localhost in dev.
      - key: API_BASE_URL
        sync: false
      # v2/v3 integrations — set each pair when you flip the matching flag on.
      # Until then they're unset and the feature stays dark.
      #   RESEND_*        → FLAG_PASSWORD_RESET (else console adapter logs link)
      #   PLAID_*         → FLAG_PLAID (PLAID_ENCRYPTION_KEY required off-sandbox)
      #   GOOGLE_OAUTH_*  → FLAG_OAUTH
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        value: sandbox
      - key: PLAID_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
